name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The tests do not start Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm test

  publish:
    # Publishes to npm when package.json has a version that is not on npm yet.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1 (Node 22 bundles npm 10).
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      - name: Publish if this version is not on npm yet
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # Trusted publishing needs an existing package: the first version is published by hand (REPO.md).
          prc=0
          pout=$(npm view "$name" name 2>&1) || prc=$?
          if [ "$prc" -ne 0 ] && echo "$pout" | grep -q 'E404'; then
            echo "$name is not on npm yet. Publish the first version by hand (see REPO.md); CI publishes the next ones."
            exit 0
          fi
          rc=0
          out=$(npm view "$name@$version" version 2>&1) || rc=$?
          if [ "$rc" -eq 0 ] && [ -n "$out" ]; then
            echo "$name@$version is already on npm, nothing to publish."
          elif [ "$rc" -eq 0 ] || echo "$out" | grep -q 'E404'; then
            npm publish
          else
            echo "$out"
            exit 1
          fi
